<!doctype html>
<html>

</head>
<body>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>

  </g>

  <!-- faint graticule arcs sweeping the corners -->
  <g fill="none" stroke="#8EA1E1" stroke-opacity="0.08" stroke-width="4">
    <circle cx="-140" cy="1120" r="620"/>
    <circle cx="-140" cy="1120" r="760"/>
    <circle cx="2040" cy="-60" r="560"/>
    <circle cx="2040" cy="-60" r="700"/>
  </g>

  <!-- sparse wave marks -->
  <g stroke="#8EA1E1" stroke-opacity="0.10" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M240 540 q30 -26 60 0 t60 0"/>
    <path d="M1560 520 q30 -26 60 0 t60 0"/>
    <path d="M930 1010 q30 -26 60 0 t60 0"/>

  <rect width="1920" height="1080" fill="url(#vig)"/>
</svg>
</body>
</html>
